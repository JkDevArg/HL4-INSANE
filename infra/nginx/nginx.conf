# nginx — punto de entrada de la plataforma (alcanzable solo desde la VPN).
# La VPN enruta 10.10.100.0/24; este server vive en 10.10.100.10.
# /        → frontend Next.js (platform-web:3000)
# /api/    → backend FastAPI (platform-api:8000), se quita el prefijo /api

server {
    listen 80;
    server_name _;

    # Tamaño de cuerpo para submits normales.
    client_max_body_size 2m;

    # API: /api/auth/login → http://platform-api:8000/auth/login
    location /api/ {
        proxy_pass         http://platform-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Importante: el backend usa X-Forwarded-For para el gate VPN (TRUST_FORWARDED_FOR=true).
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass         http://platform-web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
