# Suricata IDS — corre aparte porque necesita ver la interfaz tun0 de la VPN.
# Requiere network_mode host + NET_ADMIN/NET_RAW.
# Uso (en el servidor VPN, tras levantar la VPN):
#   docker compose -f docker-compose.suricata.yml up -d
# eve.json se escribe en /var/log/suricata y Promtail (compose principal) lo ingiere.

services:
  suricata:
    image: jasonish/suricata:7.0
    container_name: ctf-suricata
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      # Sin :ro — el entrypoint de la imagen hace chown de estos archivos al
      # arrancar; con :ro el chown falla y aborta antes de lanzar Suricata.
      - ../siem/suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ../siem/suricata/custom.rules:/etc/suricata/rules/custom.rules
      - /var/log/suricata:/var/log/suricata
    command: ["-c", "/etc/suricata/suricata.yaml", "-i", "tun0"]
