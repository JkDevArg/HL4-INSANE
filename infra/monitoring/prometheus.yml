# Prometheus del CTF — métricas históricas de recursos.
# Scrapea cAdvisor (interno, sin puerto público) cada 15s. Grafana lo consulta
# vía el datasource provisionado (uid "prometheus", url http://prometheus:9090).

global:
  scrape_interval: 15s        # frecuencia de scrape por defecto
  evaluation_interval: 15s

scrape_configs:
  # cAdvisor expone métricas por contenedor (CPU, memoria, red, FS).
  # Hostname Docker "cadvisor" en net_siem, puerto interno 8080.
  - job_name: cadvisor
    scrape_interval: 10s
    static_configs:
      - targets: ["cadvisor:8080"]

  # El propio Prometheus (útil para depurar el scrape).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
