#!/usr/sbin/nft -f
#
# ============================================================================
#  CTFHL4-INSANE — Firewall de aislamiento de equipos (nftables)
# ============================================================================
#  Implementa la "Regla de oro" de docs/ARCHITECTURE.md (sección 2):
#
#    team_N (10.10.N.0/24) SOLO puede hablar con:
#      - Plataforma + servicios internos : 10.10.100.0/24
#      - Sus PROPIOS contenedores de reto : 172.30.N.0/24
#      - DNS interno                      : 10.10.100.2
#    Todo lo demas (otros equipos, internet directo, IA) -> DROP + LOG.
#
#  Plataforma: Ubuntu 22.04, servidor OpenVPN (interfaz tun0).
#  Aplicar con: nft -f /etc/nftables.conf  (ver setup-nftables.sh)
# ============================================================================

# Limpia el ruleset previo para que la aplicacion sea idempotente.
flush ruleset

table inet ctf_isolation {

    # ------------------------------------------------------------------
    # SETS y MAPS — evitan repetir 10 reglas a mano (N = 1..10)
    # ------------------------------------------------------------------

    # Subnets de TODOS los equipos. Se usa para detectar "tráfico de equipo".
    set team_subnets {
        type ipv4_addr
        flags interval
        elements = {
            10.10.1.0/24, 10.10.2.0/24, 10.10.3.0/24, 10.10.4.0/24,
            10.10.5.0/24, 10.10.6.0/24, 10.10.7.0/24, 10.10.8.0/24,
            10.10.9.0/24, 10.10.10.0/24
        }
    }

    # MAP team_to_docker: mapea la subnet de cada equipo a SU red Docker de retos.
    #   clave  = subnet VPN del equipo   (10.10.N.0/24)
    #   valor  = subnet Docker del equipo (172.30.N.0/24)
    # Permite, en UNA sola regla, validar "el origen es team_N y el destino
    # es 172.30.N.0/24" sin escribir 10 reglas separadas.
    map team_to_docker {
        type ipv4_addr : ipv4_addr
        flags interval
        elements = {
            10.10.1.0/24  : 172.30.1.0/24,
            10.10.2.0/24  : 172.30.2.0/24,
            10.10.3.0/24  : 172.30.3.0/24,
            10.10.4.0/24  : 172.30.4.0/24,
            10.10.5.0/24  : 172.30.5.0/24,
            10.10.6.0/24  : 172.30.6.0/24,
            10.10.7.0/24  : 172.30.7.0/24,
            10.10.8.0/24  : 172.30.8.0/24,
            10.10.9.0/24  : 172.30.9.0/24,
            10.10.10.0/24 : 172.30.10.0/24
        }
    }

    # Destinos comunes permitidos a TODOS los equipos (plataforma + DNS).
    # 10.10.100.2 (DNS) ya está contenido en 10.10.100.0/24, pero se deja
    # explícito por claridad del contrato (sección 2).
    set platform_subnet {
        type ipv4_addr
        flags interval
        elements = { 10.10.100.0/24 }
    }

    set dns_internal {
        type ipv4_addr
        elements = { 10.10.100.2 }
    }

    # Stack SIEM: solo admin. Los equipos NO deben alcanzarlo (regla de oro).
    # Se declara para poder bloquearlo explícitamente con log dedicado.
    set siem_subnet {
        type ipv4_addr
        flags interval
        elements = { 10.10.200.0/24 }
    }

    # ------------------------------------------------------------------
    # CADENA INPUT — tráfico dirigido al PROPIO host (servidor VPN)
    # ------------------------------------------------------------------
    chain input {
        type filter hook input priority filter; policy drop;

        # Estado de conexión.
        ct state established,related accept
        ct state invalid drop

        # Loopback siempre permitido.
        iif "lo" accept

        # ICMP (diagnóstico básico) permitido.
        ip protocol icmp accept

        # Gestión del host:
        #   - SSH para administración (ajusta el puerto si lo cambiaste).
        #   - OpenVPN escucha en 1194/udp (único puerto público).
        tcp dport 22 accept
        udp dport 1194 accept

        # DNS interno: los clientes VPN consultan a dnsmasq en este host
        # (10.10.100.2 suele ser un alias/IP del propio servidor o del
        #  contenedor de plataforma). Permitimos las consultas desde la VPN.
        iifname "tun0" udp dport 53 accept
        iifname "tun0" tcp dport 53 accept

        # Resto al host: DROP + LOG.
        log prefix "INPUT_DROP " level warn drop
    }

    # ------------------------------------------------------------------
    # CADENA FORWARD — tráfico ENTRE redes (núcleo del aislamiento)
    # ------------------------------------------------------------------
    chain forward {
        type filter hook forward priority filter; policy drop;

        # Respuestas de conexiones ya establecidas.
        ct state established,related accept
        ct state invalid drop

        # --- 1) PERMITIDO: equipo -> su PROPIA red Docker de retos ---------
        # Una sola regla cubre los 10 equipos usando el map.
        # "ip daddr == valor_del_map(ip saddr)" => el destino Docker debe
        # corresponder EXACTAMENTE a la subnet del equipo de origen.
        ip saddr @team_subnets ip daddr ip saddr map @team_to_docker accept

        # Retorno: red Docker del equipo -> ese mismo equipo.
        ip saddr 172.30.0.0/16 ip daddr 10.10.0.0/16 ct state new accept

        # --- 2) PERMITIDO: cualquier equipo -> plataforma / servicios -----
        ip saddr @team_subnets ip daddr @platform_subnet accept
        # Retorno plataforma -> equipos.
        ip saddr @platform_subnet ip daddr @team_subnets accept

        # --- 3) PERMITIDO: cualquier equipo -> DNS interno (53) -----------
        ip saddr @team_subnets ip daddr @dns_internal udp dport 53 accept
        ip saddr @team_subnets ip daddr @dns_internal tcp dport 53 accept

        # --- 4) BLOQUEO EXPLÍCITO: equipo -> stack SIEM -------------------
        ip saddr @team_subnets ip daddr @siem_subnet \
            log prefix "SIEM_BLOCK " level warn drop

        # --- 5) BLOQUEO EXPLÍCITO: equipo -> OTRO equipo ------------------
        # Si origen es un equipo y destino es CUALQUIER subnet de equipo,
        # y NO fue aceptado arriba (no es su propia Docker ni plataforma),
        # entonces es tráfico inter-equipo => DROP + LOG.
        ip saddr @team_subnets ip daddr @team_subnets \
            log prefix "INTER_TEAM_BLOCK " level warn drop

        # Equipo -> red Docker que NO es la suya (intento de cruzar retos).
        ip saddr @team_subnets ip daddr 172.30.0.0/16 \
            log prefix "INTER_TEAM_BLOCK " level warn drop

        # --- 6) BLOQUEO: salida a internet directo desde la VPN -----------
        # Cualquier cosa originada en la VPN cuyo destino NO sea interno.
        # (El sinkhole DNS + ai-ip-blocklist.sh refuerzan el bloqueo de IA;
        #  aquí cae todo lo demás que pretenda salir a internet directo.)
        iifname "tun0" log prefix "INTERNET_BLOCK " level warn drop

        # Cualquier otro forward no contemplado: DROP + LOG.
        log prefix "FWD_DROP " level warn drop
    }

    # ------------------------------------------------------------------
    # CADENA OUTPUT — tráfico originado en el host. Permitido (gestión).
    # ------------------------------------------------------------------
    chain output {
        type filter hook output priority filter; policy accept;
        # El host necesita salir (apt, upstream DNS 1.1.1.1, SIEM, etc.).
        # Si quieres endurecerlo, cambia policy a drop y abre lo necesario.
    }
}
