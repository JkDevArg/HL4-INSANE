#!/usr/sbin/nft -f
# ============================================================================
#  CTFHL4-INSANE — Firewall de aislamiento de equipos (nftables) — SEGURO/DOCKER
# ============================================================================
#  Implementa la "Regla de oro" de docs/ARCHITECTURE.md (sección 2):
#
#    team_N (10.10.N.0/24) SOLO puede hablar con:
#      - Plataforma + servicios internos : 10.10.100.0/24
#      - Sus PROPIOS contenedores de reto : 172.30.N.0/24
#      - DNS interno (gateway VPN)        : 10.10.0.1  (input al host, no forward)
#    Todo lo demas (otros equipos, internet directo, IA, SIEM) -> DROP + LOG.
#
#  *** DISEÑO SEGURO PARA HOST CON DOCKER ***
#  - NO usa 'flush ruleset' (NO toca las reglas iptables-nft de Docker).
#  - Recrea SOLO nuestra tabla (idempotente) sin afectar a Docker.
#  - La cadena forward va a prioridad -10 (ANTES que Docker) con policy ACCEPT:
#      * Los flujos PROHIBIDOS de la VPN se DROPpean aquí (terminal: Docker ni
#        los ve) -> aislamiento garantizado.
#      * Los flujos PERMITIDOS se 'accept' y CONTINÚAN a las cadenas de Docker
#        (que DOCKER-USER habilita para tun0) -> llegan a los contenedores.
#      * Todo lo demás (tráfico interno de Docker) cae en policy accept y sigue
#        intacto.
#  - NO instalamos cadena input restrictiva (se deja el input por defecto del
#    host para no arriesgar SSH ni servicios locales).
#
#  Requisito complementario (lo aplica setup-nftables.sh): regla DOCKER-USER
#  que permite el forward tun0 <-> bridges de Docker.
#
#  Aplicar con: sudo ./setup-nftables.sh
# ============================================================================

# --- Idempotencia sin tocar Docker: recrea SOLO la tabla ctf_isolation ------
# (declara la tabla -crea si no existe-, la borra, y la vuelve a definir).
table inet ctf_isolation
delete table inet ctf_isolation

table inet ctf_isolation {

    # ------------------------------------------------------------------
    # INPUT — tráfico al PROPIO host. policy ACCEPT (no toca SSH ni nada
    # más); solo BLOQUEA que los jugadores (tun0) alcancen el SIEM público.
    # ------------------------------------------------------------------
    chain input {
        type filter hook input priority filter; policy accept;
        # Los jugadores (tun0) NO deben ver el SIEM. Bloqueamos los puertos
        # del SIEM en el host: 8090 (caster overlay público) y 3000 (Grafana).
        # Comentaristas/admin acceden por LAN/internet (no por tun0).
        iifname "tun0" tcp dport 8090 drop
        iifname "tun0" tcp dport 3000 drop
    }

    # Subnets VPN de TODOS los equipos (5 equipos).
    set team_subnets {
        type ipv4_addr
        flags interval
        elements = {
            10.10.1.0/24, 10.10.2.0/24, 10.10.3.0/24, 10.10.4.0/24,
            10.10.5.0/24
        }
    }

    # SET team_docker_pairs: pares PERMITIDOS (subnet VPN del equipo .
    # SU red Docker de retos). Set concatenado con intervalos -> en UNA regla
    # validamos "el par (origen, destino) es team_N -> 172.30.N.0/24".
    set team_docker_pairs {
        type ipv4_addr . ipv4_addr
        flags interval
        elements = {
            10.10.1.0/24  . 172.30.1.0/24,
            10.10.2.0/24  . 172.30.2.0/24,
            10.10.3.0/24  . 172.30.3.0/24,
            10.10.4.0/24  . 172.30.4.0/24,
            10.10.5.0/24  . 172.30.5.0/24
        }
    }

    # ------------------------------------------------------------------
    # FORWARD — vigila SOLO el tráfico de clientes VPN. policy ACCEPT para
    # no afectar el tráfico interno de Docker.
    # ------------------------------------------------------------------
    chain forward {
        type filter hook forward priority -10; policy accept;

        # Respuestas ya establecidas: pasan.
        ct state established,related accept

        # --- PERMITIDO: equipo -> su PROPIA red Docker de retos -----------
        # (accept -> continúa a las cadenas de Docker, habilitado por DOCKER-USER)
        ip saddr . ip daddr @team_docker_pairs accept

        # --- PERMITIDO: cualquier equipo -> plataforma / servicios --------
        ip saddr @team_subnets ip daddr 10.10.100.0/24 accept

        # --- BLOQUEO: equipo -> stack SIEM (solo admin) -------------------
        ip saddr @team_subnets ip daddr 10.10.200.0/24 \
            log prefix "SIEM_BLOCK " level warn drop

        # --- BLOQUEO: equipo -> OTRO equipo (inter-equipo) ----------------
        ip saddr @team_subnets ip daddr @team_subnets \
            log prefix "INTER_TEAM_BLOCK " level warn drop

        # --- BLOQUEO: equipo -> red Docker de OTRO equipo -----------------
        ip saddr @team_subnets ip daddr 172.30.0.0/16 \
            log prefix "INTER_TEAM_BLOCK " level warn drop

        # --- FORZAR DNS INTERNO: bloquear DNS externo desde la VPN --------
        # Los jugadores DEBEN usar el DNS interno (10.10.0.1 / dnsmasq), que
        # hace sinkhole de IA. Si pudieran usar 8.8.8.8 evadirían el bloqueo.
        # (El DNS interno es 'input' al host, no pasa por forward, así que esto
        #  no lo afecta; solo corta el DNS externo.)
        iifname "tun0" udp dport 53 log prefix "DNS_BLOCK " level warn drop
        iifname "tun0" tcp dport 53 log prefix "DNS_BLOCK " level warn drop

        # --- INTERNET PERMITIDO (NAT) -------------------------------------
        # Los jugadores SÍ pueden navegar internet general (google, etc.).
        # El bloqueo de IA/chatbots se hace por DNS (sinkhole) + DoH bloqueado.
        # La isolación entre equipos/SIEM/retos ajenos ya se aplicó arriba (drop).
        iifname "tun0" accept

        # Resto (tráfico interno de Docker): policy accept -> intacto.
    }
}
