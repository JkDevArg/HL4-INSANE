# ============================================================================
#  dnsmasq.conf — DNS interno del CTFHL4-INSANE (10.10.100.2)
# ============================================================================
#  Rol:
#    - DNS interno autoritativo/recursor para los clientes VPN.
#    - SINKHOLE de dominios de IA (resuelven a 0.0.0.0) -> ver bloque generado.
#    - Reenvía el resto de consultas a un upstream (1.1.1.1).
#    - Loguea TODAS las queries a un archivo que el SIEM puede leer.
#
#  Plataforma: Ubuntu 22.04. Instalar dnsmasq y copiar este archivo a
#  /etc/dnsmasq.conf (o /etc/dnsmasq.d/ctf.conf). Ver README.md.
#
#  IMPORTANTE: el bloque de sinkhole entre los marcadores BEGIN/END AI
#  SINKHOLE se genera automáticamente con gen-dnsmasq-blocklist.sh a partir
#  de ai-blocklist.txt. NO editar a mano ese bloque.
# ============================================================================

# --- Interfaz / escucha -----------------------------------------------------
# Escuchar en la IP del DNS interno (contrato sección 2: 10.10.100.2) y en
# loopback. Ajusta interface= a la interfaz real si 10.10.100.2 es un alias.
listen-address=127.0.0.1
listen-address=10.10.100.2
# No usar /etc/resolv.conf del sistema: definimos el upstream explícitamente.
no-resolv
# Evita reenviar consultas de nombres sin dominio o de rangos privados afuera.
domain-needed
bogus-priv

# --- Upstream (resolución del tráfico NO bloqueado) ------------------------
server=1.1.1.1
server=1.0.0.1

# --- Cache -----------------------------------------------------------------
cache-size=2000

# --- Logging para el SIEM ---------------------------------------------------
# Loguea cada query/respuesta. El collector/Promtail del SIEM lee este archivo.
# (Crear /var/log/dnsmasq con permisos antes de arrancar — ver README.md.)
log-queries=extra
log-facility=/var/log/dnsmasq/queries.log
# No mezclar con el log de DHCP (no usamos DHCP aquí).
log-async=25

# ============================================================================
# >>> BEGIN AI SINKHOLE (autogenerado por gen-dnsmasq-blocklist.sh) <<<
# Las líneas de aquí abajo se REGENERAN automáticamente. No editar a mano.
# Cada 'address=/dominio/0.0.0.0' incluye TODOS sus subdominios.
# (Ejecuta gen-dnsmasq-blocklist.sh para poblar este bloque desde ai-blocklist.txt)
# >>> END AI SINKHOLE <<<
# ============================================================================
