# CTFHL4-INSANE — Orquestación unificada
# Levanta plataforma + servicios internos + SIEM en las subnets del contrato (ARCHITECTURE.md §2/§3).
# Suricata corre aparte (docker-compose.suricata.yml) porque necesita tun0 / network host.
#
# Uso:
#   cp .env.example .env   # y edita los secretos
#   make up                # o: docker compose up -d --build
#   make seed              # crea equipos + retos e imprime credenciales

networks:
  # Red de plataforma + servicios internos. La VPN empuja ruta a 10.10.100.0/24.
  net_platform:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.100.0/24
  # Red del SIEM. Solo admin. La VPN NO la enruta (los equipos no deben verla).
  net_siem:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.200.0/24

volumes:
  pg-data:
  redis-data:
  loki-data:
  grafana-data:
  prometheus-data:    # TSDB de Prometheus (métricas históricas de recursos)
  promtail-positions: # positions.yaml persistente — evita re-leer logs históricos en restart

services:

  # ── Punto de entrada (lo único que la VPN enruta hacia la plataforma) ──────
  nginx:
    image: nginx:1.27-alpine
    container_name: ctf-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      net_platform:
        ipv4_address: 10.10.100.10
    depends_on: [platform-web, platform-api]

  # ── Frontend Next.js ───────────────────────────────────────────────────────
  platform-web:
    build:
      context: ../platform/frontend
      args:
        NEXT_PUBLIC_API_BASE: /api
    container_name: ctf-web
    restart: unless-stopped
    networks:
      net_platform:
        ipv4_address: 10.10.100.11

  # ── Backend FastAPI ──────────────────────────────────────────────────────
  platform-api:
    build: ../platform/backend
    container_name: ctf-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://ctf:${POSTGRES_PASSWORD}@postgres:5432/ctf
      - REDIS_URL=redis://redis:6379/0
      - FLAG_SERVICE_URL=http://flag-service:8001
      - COLLECTOR_URL=http://collector:9000
      - JWT_SECRET=${JWT_SECRET}
      - VPN_CIDR=10.10.0.0/16
      - TRUST_FORWARDED_FOR=true
      - MAX_SESSIONS_PER_TEAM=4
      - TEAM_COUNT=5
      - CHALLENGES_DIR=/challenges
    volumes:
      # Docker socket: needed to spin up/down per-team challenge containers on demand
      - /var/run/docker.sock:/var/run/docker.sock
      # Challenges directory: instance_manager reads docker-compose.yml files from here
      - ../challenges:/challenges:ro
    networks:
      net_platform:
        ipv4_address: 10.10.100.12
      net_siem:        # necesita alcanzar al collector
    depends_on: [postgres, redis, flag-service]

  # ── Flag Service (HMAC) — solo red interna ────────────────────────────────
  flag-service:
    build: ../flag-service
    container_name: ctf-flag-service
    restart: unless-stopped
    environment:
      - MASTER_SECRET=${MASTER_SECRET}
    networks:
      net_platform:
        ipv4_address: 10.10.100.20

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ctf-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ctf
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ctf
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      net_platform:
        ipv4_address: 10.10.100.30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (sesiones, rate-limit, contador de desconexiones, bans) ──────────
  # IP fija 10.10.100.31: los scripts de ban de OpenVPN (en el host) la usan.
  redis:
    image: redis:7-alpine
    container_name: ctf-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      net_platform:
        ipv4_address: 10.10.100.31

  # ── SIEM: Collector ──────────────────────────────────────────────────────
  collector:
    build: ../siem/collector
    container_name: ctf-collector
    restart: unless-stopped
    environment:
      - LOKI_URL=http://loki:3100
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    networks:
      net_siem:
        ipv4_address: 10.10.200.10
    depends_on: [loki]

  # ── SIEM: Loki ─────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.0
    container_name: ctf-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../siem/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      net_siem:
        ipv4_address: 10.10.200.20

  # ── SIEM: Promtail (lee logs del host) ─────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.0
    container_name: ctf-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ../siem/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/log:/var/log:ro
      - /var/log/suricata:/var/log/suricata:ro
      # Logs JSON nativos de los contenedores (peticiones CTFREQ de los retos).
      # READ-ONLY: promtail solo lee, nunca escribe.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Posiciones persistentes: evita re-leer todo al reiniciar el contenedor.
      - promtail-positions:/var/promtail
    networks:
      - net_siem
    depends_on: [loki]

  # ── SIEM: Caster Overlay (PÚBLICO, anonimizado) ───────────────────────────
  # Único servicio del SIEM expuesto a internet. Lee Loki internamente y solo
  # publica datos ANONIMIZADOS (Equipo NN, nunca IPs). Players (tun0) bloqueados
  # por nftables. Grafana/Loki siguen siendo internos (admin).
  caster-overlay:
    build: ../siem/caster-overlay
    container_name: ctf-caster
    restart: unless-stopped
    environment:
      - LOKI_URL=http://loki:3100
      - WINDOW_MIN=15
      - CTF_NAME=${CTF_NAME:-CTFHL4-INSANE}
    networks:
      - net_siem
    ports:
      - "8090:8090"   # público (stream/comentaristas). tun0 bloqueado por nft.
    depends_on: [loki]

  # ── SIEM: Grafana (solo admin, vía túnel SSH al 3000) ──────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: ctf-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-ctfadmin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ../siem/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      net_siem:
        ipv4_address: 10.10.200.30
    ports:
      - "127.0.0.1:3000:3000"   # SOLO admin (túnel SSH). El público usa caster-overlay.
    depends_on: [loki]

  # ── Monitoreo de recursos: cAdvisor (métricas por contenedor) ──────────────
  # Expone CPU/RAM/red/FS de cada contenedor. NO publica puerto: Prometheus lo
  # scrapea internamente (cadvisor:8080). privileged para leer cgroups del host.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ctf-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - net_siem   # solo admin; sin IP fija ni puerto publicado

  # ── Monitoreo de recursos: Prometheus (TSDB + scraper) ─────────────────────
  # Scrapea cAdvisor cada 15s. Publica SOLO en 127.0.0.1:9090 para depurar
  # (Grafana lo consume internamente vía http://prometheus:9090).
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ctf-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - net_siem
    ports:
      - "127.0.0.1:9090:9090"   # SOLO admin (depuración del scrape). Túnel SSH.
    depends_on: [cadvisor]

  # ── Panel admin propio (recursos en vivo + control ON/OFF por equipo) ──────
  # AISLADO del caster y de los jugadores: se publica SOLO en 127.0.0.1:8091
  # (túnel SSH). Monta el socket de Docker para leer stats y hacer stop/start
  # de los contenedores ctf_team_* (lista blanca aplicada en el código).
  admin-panel:
    build: ../siem/admin-panel
    container_name: ctf-admin-panel
    restart: unless-stopped
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      # Acceso al motor de Docker: stats EN VIVO + start/stop de contenedores.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - net_siem
    ports:
      - "127.0.0.1:8091:8091"   # SOLO localhost -> túnel SSH. Jugadores e internet NO lo alcanzan.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8091/healthz').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 3
