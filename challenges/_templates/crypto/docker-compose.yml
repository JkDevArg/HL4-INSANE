# Template CRYPTO. Parametrizable por equipo: TEAM_ID + FLAG.
#   TEAM_ID=team_03 FLAG="HL4{...}" docker compose -p crypto-CAMBIAME-NN__team_03 up -d
services:
  crypto:
    build: .
    image: crypto-cambiame-nn
    environment:
      FLAG: "${FLAG:-HL4{EJEMPLO_LOCAL}}"
      TEAM_ID: "${TEAM_ID:-team_local}"
      CHALLENGE_ID: "crypto-CAMBIAME-NN"
      COLLECTOR_URL: "${COLLECTOR_URL:-http://collector:9000}"
    ports:
      - "${PORT:-9999}:9999"
    restart: unless-stopped
