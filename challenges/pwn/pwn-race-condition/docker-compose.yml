networks:
  team_net:
    external: true
    name: ${CHAL_NET:-ctf_local}

services:
  app:
    build: .
    image: pwn-race-condition-app
    environment:
      FLAG: "${FLAG:-HL4{f4ke_fl4g_r4c3_c0nd1t10n}}"
      TEAM_ID: "${TEAM_ID:-team_local}"
      CHALLENGE_ID: "pwn-race-condition"
    networks:
      team_net:
        ipv4_address: 172.30.${TEAM_N:-99}.31
    restart: unless-stopped
