# pwn-javadeser-02 - Equicore. Parametrizable por equipo: TEAM_ID + FLAG + TEAM_N + CHAL_NET.
#   Lanzado por infra/launch-team-challenges.sh:
#     TEAM_ID=team_03 TEAM_N=3 FLAG="HL4{...}" CHAL_NET=ctf_team_03 \
#       docker compose -p ctf_team_03_pwn_javadeser_02 up -d --build
#
# AISLAMIENTO: vive SOLO en la red del equipo (172.30.N.0/24) en .41:8080, sin
# publicar puertos al host. Accesible por la VPN del equipo via nftables.
networks:
  team_net:
    external: true
    name: ${CHAL_NET:-ctf_local}

services:
  app:
    build: .
    image: pwn-javadeser-02
    environment:
      FLAG: "${FLAG:-HL4{EJEMPLO_LOCAL}}"
      TEAM_ID: "${TEAM_ID:-team_local}"
      CHALLENGE_ID: "pwn-javadeser-02"
      COLLECTOR_URL: "${COLLECTOR_URL:-http://collector:9000}"
    networks:
      team_net:
        ipv4_address: 172.30.${TEAM_N:-99}.41
    restart: unless-stopped
