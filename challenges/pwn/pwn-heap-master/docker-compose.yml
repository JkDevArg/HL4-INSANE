# pwn-heap-master — UAF + tcache poisoning (glibc 2.35)
# TEAM_ID=team_05 TEAM_N=5 FLAG="HL4{...}" CHAL_NET=ctf_team_05 docker compose up -d --build
networks:
  team_net:
    external: true
    name: ${CHAL_NET:-ctf_local}

services:
  app:
    build: .
    image: pwn-heap-master-app
    environment:
      FLAG: "${FLAG:-HL4{f4ke_h34p_m4st3r}}"
      TEAM_ID: "${TEAM_ID:-team_local}"
      CHALLENGE_ID: "pwn-heap-master"
    networks:
      team_net:
        ipv4_address: 172.30.${TEAM_N:-99}.31
    restart: unless-stopped
