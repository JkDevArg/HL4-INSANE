# pwn-sandbox-escape — Python eval() sandbox escape
# TEAM_ID=team_04 TEAM_N=4 FLAG="HL4{...}" CHAL_NET=ctf_team_04 docker compose up -d --build
networks:
  team_net:
    external: true
    name: ${CHAL_NET:-ctf_local}

services:
  app:
    build: .
    image: pwn-sandbox-escape-app
    environment:
      FLAG: "${FLAG:-HL4{f4ke_s4ndbox_3sc4p3}}"
      TEAM_ID: "${TEAM_ID:-team_local}"
      CHALLENGE_ID: "pwn-sandbox-escape"
    networks:
      team_net:
        ipv4_address: 172.30.${TEAM_N:-99}.32
    restart: unless-stopped
