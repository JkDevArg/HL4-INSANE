networks:
  team_net:
    external: true
    name: ${CHAL_NET:-ctf_local}

services:
  app:
    build: .
    image: pwn-format-string-app
    environment:
      FLAG: "${FLAG:-HL4{f4ke_fl4g_f0rm4t_str1ng}}"
      TEAM_ID: "${TEAM_ID:-team_local}"
      CHALLENGE_ID: "pwn-format-string"
    networks:
      team_net:
        ipv4_address: 172.30.${TEAM_N:-99}.30
    restart: unless-stopped
