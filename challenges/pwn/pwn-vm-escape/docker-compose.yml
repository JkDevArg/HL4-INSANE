networks:
  team_net:
    external: true
    name: ${CHAL_NET:-ctf_local}

services:
  app:
    build: .
    image: pwn-vm-escape-app
    environment:
      FLAG: "${FLAG:-HL4{f4ke_fl4g_vm_3sc4p3}}"
      TEAM_ID: "${TEAM_ID:-team_local}"
      CHALLENGE_ID: "pwn-vm-escape"
    networks:
      team_net:
        ipv4_address: 172.30.${TEAM_N:-99}.32
    restart: unless-stopped
