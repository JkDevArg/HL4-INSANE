# api-cache-05 — Edge/CDN simulado (nginx) para "Poisoned Edge".
#
# VULN #2 (del edge): WEB CACHE DECEPTION.
#   El edge decide si cachea SOLO mirando la extension / patron de la URL.
#   Para URLs que "parecen" estaticas (terminan en .css/.js o cuelgan de
#   /static/), cachea AGRESIVAMENTE la respuesta del backend:
#     - ignora la cookie de sesion en la cache-key  (proxy_cache_key sin $cookie)
#     - ignora el Cache-Control: private/no-store del backend
#       (proxy_ignore_headers Cache-Control Set-Cookie Expires)
#     - fuerza un TTL propio (proxy_cache_valid)
#   => la respuesta PERSONALIZADA de un usuario autenticado queda guardada en
#      una clave PUBLICA y se sirve a cualquiera sin cookie.
#
# Este es exactamente el patron de CDN mal configurado del mundo real
# (Cloudflare/Akamai "cache everything by extension").

user  nginx;
worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # Zona de cache en disco del edge.
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=edge_cache:10m
                     max_size=64m inactive=10m use_temp_path=off;

    # Log de acceso del edge a stdout (lo ve el operador; el SIEM real sale del
    # backend via CTFREQ). Marca HIT/MISS para depurar el cacheo.
    log_format edge '$remote_addr "$request" $status cache=$upstream_cache_status';
    access_log /var/log/nginx/access.log edge;

    upstream edgenews_api {
        server api:8000;
    }

    map $request_uri $is_staticish {
        default                 0;
        "~*\.(css|js|png|jpg|gif|ico|svg|woff2?)(\?|$)"  1;
        "~*^/static/"           1;
    }

    server {
        listen 8080;
        server_name _;

        # Pasa la IP real del cliente al backend (para el reqlog CTFREQ).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --------- RUTA "ESTATICA" (vulnerable a cache deception) ----------
        # Cualquier URL que parezca un asset estatico se cachea de forma
        # insegura: la cache-key NO incluye la cookie, y se ignora el
        # Cache-Control privado del backend.
        location ~* (\.(?:css|js|png|jpg|gif|ico|svg|woff2?)(?:\?|$)|^/static/) {
            proxy_pass http://edgenews_api;

            proxy_cache edge_cache;
            # CACHE-KEY INSEGURO: solo metodo + host + URI. SIN $http_cookie.
            proxy_cache_key "$request_method$host$request_uri";

            # El edge IGNORA las directivas de privacidad del backend.
            proxy_ignore_headers Cache-Control Set-Cookie Expires Vary;
            proxy_hide_header Set-Cookie;

            # Cachea respuestas OK aunque el backend pida no-store.
            proxy_cache_valid 200 301 302 10m;
            proxy_cache_valid any 1m;

            add_header X-Edge-Cache $upstream_cache_status always;
        }

        # --------- RUTA DINAMICA (no cacheada) ----------
        location / {
            proxy_pass http://edgenews_api;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header X-Edge-Cache "DYNAMIC" always;
        }
    }
}
