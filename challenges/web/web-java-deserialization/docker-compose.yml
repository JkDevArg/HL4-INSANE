# web-java-deserialization — Spring Boot Java deserialization RCE via Commons Collections
# Lanzar: TEAM_ID=team_05 TEAM_N=5 FLAG="HL4{...}" CHAL_NET=ctf_team_05 docker compose -f challenges/web/web-java-deserialization/docker-compose.yml up -d --build
networks:
  team_net:
    external: true
    name: ${CHAL_NET:-ctf_local}

services:
  app:
    build: .
    image: web-java-deserialization-app
    environment:
      FLAG: "${FLAG:-HL4{EJEMPLO_LOCAL}}"
      TEAM_ID: "${TEAM_ID:-team_local}"
      CHALLENGE_ID: "web-java-deserialization"
    networks:
      team_net:
        ipv4_address: 172.30.${TEAM_N:-99}.11
    restart: unless-stopped
