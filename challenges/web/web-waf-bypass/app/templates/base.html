<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Corporate Portal{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
.waf-badge { background: #28a745; }
.navbar-brand span { color: #ffc107; }
footer { margin-top: 3rem; padding: 1rem 0; border-top: 1px solid #dee2e6; }
</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">Corporate <span>Portal</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/search">Search</a></li>
        <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <span class="badge waf-badge">WAF Protected</span>
        {% if session.user %}
        <span class="text-white small">{{ session.user }}</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        {% else %}
        <a href="/login" class="btn btn-outline-light btn-sm">Login</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
<div class="container mt-4">
  {% block content %}{% endblock %}
</div>
<footer class="text-center text-muted">
  <div class="container">
    <small>Corporate Portal v3.1 | Protected by Custom WAF v2.0</small>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
