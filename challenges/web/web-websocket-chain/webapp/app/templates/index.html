<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CollabChat - Real-time Collaboration</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <span class="navbar-brand fw-bold">CollabChat Platform</span>
    <a href="/login" class="btn btn-outline-light btn-sm">Login</a>
  </div>
</nav>
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 text-center">
      <div class="card shadow">
        <div class="card-body py-5">
          <h1 class="display-5 fw-bold text-primary mb-3">Real-time Collaboration</h1>
          <p class="lead text-muted">Instant messaging with WebSocket technology. Admins have special command capabilities.</p>
          <div class="row mt-4">
            <div class="col-md-4">
              <div class="card border-0 bg-light">
                <div class="card-body">
                  <h5 class="text-primary">Real-time</h5>
                  <p class="small">WebSocket-powered instant messaging</p>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card border-0 bg-light">
                <div class="card-body">
                  <h5 class="text-success">Secure</h5>
                  <p class="small">Token-based authentication</p>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card border-0 bg-light">
                <div class="card-body">
                  <h5 class="text-info">Admin Bot</h5>
                  <p class="small">Automated maintenance commands</p>
                </div>
              </div>
            </div>
          </div>
          <a href="/login" class="btn btn-primary btn-lg mt-4">Get Started</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
