description: >
  Una plataforma de colaboración en tiempo real usa WebSockets para comunicación
  instantánea entre usuarios. Los administradores tienen acceso a comandos
  especiales del servidor. El bot de administración está siempre conectado
  y ejecuta comandos de mantenimiento. ¿Puede un usuario no autorizado
  enviar mensajes al canal del admin?
