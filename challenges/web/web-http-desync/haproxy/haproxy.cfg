global
    daemon
    maxconn 256
    log stdout format raw local0 info

defaults
    mode http
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    log global
    # http-server-close: HAProxy closes backend connection after each request
    # but reuses frontend connection — enables CL.TE smuggling
    option http-server-close
    # NO option http-tunnel (would disable smuggling)

frontend http_front
    bind *:8080
    default_backend http_back

backend http_back
    # gunicorn backend: processes Transfer-Encoding before Content-Length
    # This creates the CL.TE desync condition
    server webapp webapp-backend:5000 check
