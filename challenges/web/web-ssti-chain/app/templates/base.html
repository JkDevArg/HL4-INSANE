<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ReportEngine Pro{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .navbar { background: #212529 !important; }
    .sidebar { background: #343a40; min-height: calc(100vh - 56px); }
    .sidebar .nav-link { color: #adb5bd; padding:.5rem 1rem; border-radius:5px; margin:2px 6px; font-size:.88rem; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background:#495057; color:#fff; }
    .card { border:none; box-shadow:0 1px 6px rgba(0,0,0,.1); }
    .card-header { background:#fff; font-weight:600; border-bottom:2px solid #f8f9fa; }
    .sandbox-badge { background: linear-gradient(135deg, #dc3545, #c82333); color:#fff; padding:.2rem .6rem; border-radius:4px; font-size:.78rem; font-weight:600; }
    pre.template-output { background:#1e2d3d; color:#a8ff78; border-radius:8px; padding:1rem; font-size:.83rem; min-height:80px; max-height:400px; overflow-y:auto; white-space:pre-wrap; word-break:break-all; }
    .blocked-banner { background:#fff3cd; border:1px solid #ffc107; border-radius:8px; padding:.75rem 1rem; }
    textarea.template-editor { font-family: 'Courier New', monospace; font-size:.85rem; background:#1e2d3d; color:#e2e8f0; border:1px solid #495057; }
    textarea.template-editor:focus { background:#1e2d3d; color:#e2e8f0; border-color:#6c757d; box-shadow: none; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark py-2">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/"><i class="bi bi-file-earmark-bar-graph me-2"></i>ReportEngine Pro</a>
    <div class="d-flex align-items-center gap-2">
      <span class="sandbox-badge"><i class="bi bi-shield-lock me-1"></i>BasicSandbox v2.1 Activo</span>
      {% if logged_in %}
        <span class="badge bg-secondary ms-2">{{ username }}</span>
        <a href="/logout" class="btn btn-sm btn-outline-light">Salir</a>
      {% else %}
        <a href="/login" class="btn btn-sm btn-primary">Ingresar</a>
      {% endif %}
    </div>
  </div>
</nav>
<div class="container-fluid">
  <div class="row">
    <nav class="col-md-2 d-none d-md-block sidebar py-3">
      <ul class="nav flex-column">
        <li><a class="nav-link {% if request.path == '/render' %}active{% endif %}" href="/render"><i class="bi bi-pencil-square me-1"></i>Editor de Plantillas</a></li>
        {% if logged_in %}
        <li><a class="nav-link {% if request.path == '/templates' %}active{% endif %}" href="/templates"><i class="bi bi-collection me-1"></i>Mis Plantillas</a></li>
        {% endif %}
        <li><a class="nav-link" href="/api/sandbox-info"><i class="bi bi-info-circle me-1"></i>Info Sandbox</a></li>
      </ul>
    </nav>
    <main class="col-md-10 ms-sm-auto px-4 py-4">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
