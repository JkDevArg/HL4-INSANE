# web-jwt-04 — Forged Crown. Parametrizable por equipo: TEAM_ID + FLAG + TEAM_N + CHAL_NET.
#   Lanzado por infra/launch-team-challenges.sh:
#     TEAM_ID=team_03 TEAM_N=3 FLAG="flag{...}" CHAL_NET=ctf_team_03 \
#       docker compose -p ctf_team_03_web_jwt_04 up -d --build
#
# AISLAMIENTO: el servicio vive SOLO en la red del equipo (172.30.N.0/24),
# sin publicar puertos al host. El jugador alcanza la "Royal Console" por la VPN.
#   - royal: Royal Console (auth JWT, alg-confusion + jwk/jku) -> .14:8080
networks:
  team_net:
    external: true
    name: ${CHAL_NET:-ctf_local}

services:
  royal:
    build: .
    image: web-jwt-04-royal
    environment:
      FLAG: "${FLAG:-flag{EJEMPLO_LOCAL}}"
      TEAM_ID: "${TEAM_ID:-team_local}"
      CHALLENGE_ID: "web-jwt-04"
      COLLECTOR_URL: "${COLLECTOR_URL:-http://collector:9000}"
    networks:
      team_net:
        ipv4_address: 172.30.${TEAM_N:-99}.14
    restart: unless-stopped
