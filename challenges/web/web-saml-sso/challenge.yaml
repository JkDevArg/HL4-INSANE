description: >
  Una empresa corporativa usa SAML SSO para autenticar usuarios en su portal
  de documentos. El Identity Provider emite aserciones firmadas, el Service
  Provider las valida, y hay un importador de documentos XML para los empleados.
  El vault de credenciales está protegido... o eso creen.
