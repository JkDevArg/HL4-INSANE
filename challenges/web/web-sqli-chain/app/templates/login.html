{% extends "base.html" %}
{% block title %}ERP — Acceso{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card">
      <div class="card-header text-center py-3">
        <i class="bi bi-person-lock fs-3 text-primary"></i>
        <h5 class="mt-1 mb-0">Acceso al ERP</h5>
      </div>
      <div class="card-body p-4">
        {% if error %}<div class="alert alert-danger py-2 small">{{ error }}</div>{% endif %}
        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold small">Usuario</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold small">Contraseña</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button class="btn btn-primary w-100">Ingresar</button>
        </form>
      </div>
    </div>
    <div class="text-center mt-3">
      <p class="text-muted small mb-1">Protegido por BasicGuard WAF v1.2</p>
      <p class="text-muted" style="font-size:.75rem;">ERP Corporativo v3.2.1 — Sistema de Gestión Empresarial</p>
    </div>
  </div>
</div>
{% endblock %}
