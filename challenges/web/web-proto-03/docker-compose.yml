# web-proto-03 — Prototype of Doom. Parametrizable por equipo: TEAM_ID + FLAG + TEAM_N + CHAL_NET.
#   Lanzado por infra/launch-team-challenges.sh:
#     TEAM_ID=team_03 TEAM_N=3 FLAG="HL4{...}" CHAL_NET=ctf_team_03 \
#       docker compose -p ctf_team_03_web_proto_03 up -d --build
#
# AISLAMIENTO: el servicio vive SOLO en la red del equipo (172.30.N.0/24), sin
# publicar puertos al host. El jugador alcanza "Doom Templates" por la VPN.
#   - app: Doom Templates (Node/Express, prototype pollution -> RCE) -> .16:8080
#
# La contaminación del prototipo es por-proceso: cada equipo contamina SU
# instancia y lee SU flag. No hay estado compartido entre equipos.
networks:
  team_net:
    external: true
    name: ${CHAL_NET:-ctf_local}

services:
  app:
    build: .
    image: web-proto-03-app
    environment:
      FLAG: "${FLAG:-HL4{EJEMPLO_LOCAL}}"
      TEAM_ID: "${TEAM_ID:-team_local}"
      CHALLENGE_ID: "web-proto-03"
      COLLECTOR_URL: "${COLLECTOR_URL:-http://collector:9000}"
    networks:
      team_net:
        ipv4_address: 172.30.${TEAM_N:-99}.16
    restart: unless-stopped
