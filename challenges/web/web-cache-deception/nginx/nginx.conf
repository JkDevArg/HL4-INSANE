worker_processes 1;
events { worker_connections 1024; }

http {
    # Cache zone: 10MB metadata store, 100MB max cached data
    proxy_cache_path /tmp/nginx_cache
        levels=1:2
        keys_zone=corp_cache:10m
        max_size=100m
        inactive=5m
        use_temp_path=off;

    server {
        listen 8080;
        server_name _;

        # Cache static-looking URLs regardless of Content-Type
        # VULNERABILITY: the app serves /profile/info.css as profile JSON
        # because Flask matches by path, not extension. Nginx caches it
        # for ALL users — so if admin hits /profile/info.css, attacker
        # gets the cached response with admin's flag.
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg|map)$ {
            proxy_pass http://webapp:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;

            proxy_cache corp_cache;
            proxy_cache_valid 200 302 60s;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            # Do NOT vary by Cookie — this is the vulnerability
            proxy_ignore_headers Set-Cookie;
            proxy_hide_header Set-Cookie;

            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Served-By "CorpCDN/1.0";
        }

        # Dynamic content — not cached
        location / {
            proxy_pass http://webapp:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
            add_header X-Cache-Status "BYPASS";
        }
    }
}
