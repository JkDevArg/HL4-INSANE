networks:
  team_net:
    external: true
    name: ${CHAL_NET:-ctf_local}

services:
  app:
    build: .
    image: crypto-bleichenbacher-app
    environment:
      FLAG: "${FLAG:-HL4{test_flag_local}}"
      TEAM_ID: "${TEAM_ID:-team_local}"
      CHALLENGE_ID: "crypto-bleichenbacher"
    networks:
      team_net:
        ipv4_address: 172.30.${TEAM_N:-99}.21
    restart: unless-stopped
