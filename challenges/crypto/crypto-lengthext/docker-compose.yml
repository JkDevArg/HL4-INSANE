# crypto-lengthext — MD5 Length Extension Attack. Parametrizable por equipo.
#   TEAM_ID=team_03 TEAM_N=3 FLAG="HL4{...}" CHAL_NET=ctf_team_03 \
#     docker compose -p ctf_team_03_crypto_lengthext up -d --build
#
# AISLAMIENTO: servicio HTTP en 172.30.N.37:9999.
networks:
  team_net:
    external: true
    name: ${CHAL_NET:-ctf_local}

services:
  crypto:
    build: .
    image: crypto-lengthext
    environment:
      FLAG: "${FLAG:-HL4{EJEMPLO_LOCAL}}"
      TEAM_ID: "${TEAM_ID:-team_local}"
      CHALLENGE_ID: "crypto-lengthext"
      COLLECTOR_URL: "${COLLECTOR_URL:-http://collector:9000}"
    networks:
      team_net:
        ipv4_address: 172.30.${TEAM_N:-99}.30
    restart: unless-stopped
