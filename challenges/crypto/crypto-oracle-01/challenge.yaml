id: crypto-oracle-01
category: crypto
name: "Padding Confessions"
difficulty: insane
type: per-team
serve: tcp
flag_via: flag-service
points: 500
ports: [9999]
siem: true
description: >
  Servicio TCP "SecureVault" que cifra un secreto con AES-CBC. Te entrega el
  token cifrado y, amablemente, te dice si un token que le envías tiene padding
  válido. Conéctate con `nc <host> 9999`. ¿Qué podría salir mal con un oráculo
  de padding?
