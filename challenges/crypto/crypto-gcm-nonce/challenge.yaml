description: >
  Un servidor usa AES-256-GCM para cifrar mensajes, pero reutiliza el mismo
  nonce para todos los mensajes. Tienes el texto plano de un mensaje y su
  ciphertext. El flag está cifrado con el mismo nonce. Recupéralo.
