# crypto-aesgcm-04 — Nonce Reuse Roulette. Parametrizable por equipo: TEAM_ID + FLAG + TEAM_N + CHAL_NET.
#   Lanzado por infra/launch-team-challenges.sh:
#     TEAM_ID=team_03 TEAM_N=3 FLAG="flag{...}" CHAL_NET=ctf_team_03 \
#       docker compose -p ctf_team_03_crypto_aesgcm_04 up -d --build
#
# AISLAMIENTO: servicio TCP SOLO en la red del equipo (172.30.N.0/24) en .33:9999,
# sin publicar puertos al host. Se alcanza con: nc 172.30.N.33 9999 (desde la VPN).
networks:
  team_net:
    external: true
    name: ${CHAL_NET:-ctf_local}

services:
  crypto:
    build: .
    image: crypto-aesgcm-04
    environment:
      FLAG: "${FLAG:-flag{EJEMPLO_LOCAL}}"
      TEAM_ID: "${TEAM_ID:-team_local}"
      CHALLENGE_ID: "crypto-aesgcm-04"
      COLLECTOR_URL: "${COLLECTOR_URL:-http://collector:9000}"
    networks:
      team_net:
        ipv4_address: 172.30.${TEAM_N:-99}.33
    restart: unless-stopped
