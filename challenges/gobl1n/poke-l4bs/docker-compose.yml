# gobl1n-poke-l4bs — POKE_L4BS Game Boy Color via cloud-game
# Variables inyectadas por instance_manager: TEAM_ID, TEAM_N, FLAG, CHAL_NET
#
# Arquitectura:
#   nginx (.50:8080)  — entry point + proxy coordinator + inyecta overlay CTF
#   coordinator       — cloud-game signaling (WebSocket) + web UI
#   worker (.52)      — ejecución del juego server-side + stream WebRTC
#   flag-api          — entrega de flag con timer de gameplay (interno)
#
# El ROM no es descargable: está baked en la imagen del worker.
# WebRTC va del browser directamente al worker (.52), por eso worker
# necesita IP en team_net (reachable desde la VPN del jugador).

networks:
  team_net:
    external: true
    name: ${CHAL_NET:-ctf_local}
  internal_net:
    driver: bridge
    internal: true

services:
  coordinator:
    image: giongto35/coordinator:latest
    environment:
      - CLOUD_COORDINATOR_ADDRESS=0.0.0.0:8000
    networks:
      - internal_net
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: gobl1n-poke-worker-${TEAM_ID:-local}
    environment:
      - CLOUD_COORDINATOR=coordinator:8000
      - CLOUD_GAME_DIR=/home/cloudretro/games
    networks:
      team_net:
        ipv4_address: 172.30.${TEAM_N:-99}.52
      internal_net:
    depends_on:
      - coordinator
    restart: unless-stopped

  flag-api:
    build:
      context: ./flag-api
    image: gobl1n-poke-flagapi-${TEAM_ID:-local}
    environment:
      - FLAG=${FLAG:-HL4{test_gobl1n_flag}}
      - PLAY_SECONDS=180
    networks:
      - internal_net
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    image: gobl1n-poke-nginx-${TEAM_ID:-local}
    networks:
      team_net:
        ipv4_address: 172.30.${TEAM_N:-99}.50
      internal_net:
    depends_on:
      - coordinator
      - flag-api
    restart: unless-stopped
