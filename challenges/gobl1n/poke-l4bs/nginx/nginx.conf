events { worker_connections 1024; }

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 8080;

        # ── CTF API: sesión + estado + flag ──────────────────────────────────
        # proxy_pass con trailing slash: nginx quita el prefijo /ctf/
        location /ctf/ {
            proxy_pass        http://flag-api:8001/;
            proxy_set_header  Cookie $http_cookie;
        }

        # ── Overlay JS estático ──────────────────────────────────────────────
        location /ctf-static/ {
            alias /www/;
        }

        # ── WebSocket cloud-game (señalización WebRTC) ───────────────────────
        location /ws {
            proxy_pass         http://coordinator:8000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
        }

        # ── Todo lo demás → coordinator (HTML + assets) ──────────────────────
        location / {
            proxy_pass        http://coordinator:8000;
            proxy_http_version 1.1;
            proxy_set_header  Host            $host;
            proxy_set_header  X-Real-IP       $remote_addr;
            # Sin compression para que sub_filter pueda modificar el HTML
            proxy_set_header  Accept-Encoding "";

            # Inyectar overlay CTF antes del </body>
            sub_filter        '</body>' '<div id="ctf-overlay-root"></div><script src="/ctf-static/ctf-overlay.js"></script></body>';
            sub_filter_once   on;
            sub_filter_types  text/html;
        }
    }
}
