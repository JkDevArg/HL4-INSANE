events { worker_connections 1024; }

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Permite que la misma location sirva HTTP normal Y WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;

        # ── CTF API: sesión + estado + flag ──────────────────────────────────
        location /ctf/ {
            proxy_pass       http://flag-api:8001/;
            proxy_set_header Cookie $http_cookie;
        }

        # ── Overlay JS estático ──────────────────────────────────────────────
        location /ctf-static/ {
            alias /www/;
        }

        # ── Auto-redirect a noVNC con autoconexión y escala ──────────────────
        location = / {
            return 302 /vnc.html?autoconnect=1&resize=scale;
        }

        # ── Todo lo demás → emulador noVNC (HTTP + WebSocket en un mismo bloque)
        location / {
            proxy_pass         http://emulator:6080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Accept-Encoding   "";   # sin gzip → sub_filter funciona
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;

            # Inyectar overlay CTF antes de </body>
            sub_filter        '</body>' '<div id="ctf-overlay-root"></div><script src="/ctf-static/ctf-overlay.js"></script></body>';
            sub_filter_once   on;
            sub_filter_types  text/html;
        }
    }
}
