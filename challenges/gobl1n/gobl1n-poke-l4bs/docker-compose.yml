# gobl1n-poke-l4bs — POKE_L4BS Game Boy Color (mGBA + noVNC + CTF overlay)
# Variables inyectadas por instance_manager: TEAM_ID, TEAM_N, FLAG, CHAL_NET
#
# Arquitectura (3 contenedores por equipo):
#   nginx (.50:8080)  — entry point, proxy noVNC, inyecta overlay CTF
#   emulator          — mGBA via Xvfb+x11vnc+noVNC (sin imagen de terceros)
#   flag-api          — timer de gameplay + entrega de flag (interno)
#
# El ROM está baked en la imagen del emulador — no accesible via HTTP.
# El jugador controla el juego en el navegador (teclado/ratón vía noVNC).

networks:
  team_net:
    external: true
    name: ${CHAL_NET:-ctf_local}
  internal_net:
    driver: bridge
    internal: true

services:
  emulator:
    build:
      context: .
      dockerfile: Dockerfile.emulator
    image: gobl1n-poke-emulator-${TEAM_ID:-local}
    networks:
      - internal_net
    restart: unless-stopped

  flag-api:
    build:
      context: ./flag-api
    image: gobl1n-poke-flagapi-${TEAM_ID:-local}
    environment:
      - FLAG=${FLAG:-HL4{test_gobl1n_flag}}
    networks:
      - internal_net
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    image: gobl1n-poke-nginx-${TEAM_ID:-local}
    networks:
      team_net:
        ipv4_address: 172.30.${TEAM_N:-99}.50
      internal_net:
    depends_on:
      - emulator
      - flag-api
    restart: unless-stopped
