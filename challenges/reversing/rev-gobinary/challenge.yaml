description: >
  Un sistema de activacion de licencias fue compilado en Go con todas las
  symbols stripeadas. El binario valida una clave de 17 caracteres mediante
  un cifrado XOR rotante derivado de una constante magica embebida.
  Descarga el binario desde /binary, analiza el algoritmo de validacion
  y recupera la clave de licencia valida.
