# rev-packed-delta — Packed Binary + Delta Decryption
# Lanzado por infra/launch-team-challenges.sh:
#   TEAM_ID=team_03 TEAM_N=3 FLAG="HL4{...}" CHAL_NET=ctf_team_03 \
#     docker compose -p ctf_team_03_rev_packed_delta up -d --build
services:
  app:
    build: .
    container_name: "ctf_${TEAM_ID:-local}_rev-packed-delta"
    environment:
      - FLAG=${FLAG:-HL4{placeholder}}
      - TEAM_ID=${TEAM_ID:-local}
    networks:
      challenge_net:
        ipv4_address: 172.30.${TEAM_N:-99}.40
    restart: unless-stopped

networks:
  challenge_net:
    external: true
    name: ${CHAL_NET:-ctf_local}
