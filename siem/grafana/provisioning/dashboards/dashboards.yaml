# Provider de dashboards: carga todos los JSON de esta carpeta al arrancar.
apiVersion: 1

providers:
  - name: ctf-siem
    orgId: 1
    # Folder General (vacío): legible por el rol Viewer anónimo (caster/público).
    # Un folder personalizado en Grafana 10.x bloquea al anónimo por RBAC.
    folder: ""
    type: file
    disableDeletion: false
    # Recarga los JSON cada 30s (útil al iterar dashboards).
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Path dentro del contenedor de Grafana (montar esta carpeta aquí).
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
