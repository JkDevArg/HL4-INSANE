<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTFHL4 · Streams</title>
<style>
  :root {
    --bg:#03060a; --panel:#08111a; --panel2:#0c1b2a; --grid:#11293a;
    --neon:#00ff9c; --cyan:#2de2ff; --cyan-dim:#1a8fb3; --red:#ff2e4d;
    --red-glow:rgba(255,46,77,0.55); --orange:#ff9b2d; --yellow:#ffe04a;
    --green:#2dff8c; --dim:#5e7488; --dimmer:#3b4d5e; --txt:#cfe2f2;
    --mono:"JetBrains Mono","Fira Code",Consolas,ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--mono);overflow:hidden}
  body{
    background:
      radial-gradient(1400px 700px at 85% -12%,rgba(0,255,156,0.07),transparent),
      radial-gradient(1000px 600px at 0% 112%,rgba(45,226,255,0.06),transparent),
      var(--bg);
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(45,226,255,0.03) 1px,transparent 1px),
      linear-gradient(90deg,rgba(45,226,255,0.03) 1px,transparent 1px);
    background-size:46px 46px;
    mask-image:radial-gradient(circle at 50% 40%,#000 30%,transparent 92%);
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:999;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,0.05) 3px);
    opacity:0.4;
  }
  .app{position:relative;z-index:1;display:grid;grid-template-rows:auto 1fr;height:100vh;padding:12px 16px;gap:10px}

  /* ── header ── */
  header{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    border:1px solid var(--grid);background:linear-gradient(180deg,var(--panel2),var(--panel));
    padding:10px 18px;
    box-shadow:0 0 28px rgba(0,255,156,0.04);
  }
  .brand{display:flex;align-items:center;gap:18px}
  .logo{font-size:22px;font-weight:800;letter-spacing:3px;color:var(--neon);text-shadow:0 0 14px rgba(0,255,156,0.5);display:flex;align-items:center;gap:12px}
  .live-badge{color:var(--red);font-size:12px;letter-spacing:2px;font-weight:800;display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border:1px solid var(--red);box-shadow:0 0 12px var(--red-glow);border-radius:2px}
  .led-r{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);animation:blink 1.1s steps(2,start) infinite}
  @keyframes blink{50%{opacity:0.15}}
  .subtitle{color:var(--dim);font-size:11px;letter-spacing:3px}
  .clock-box{font-size:20px;font-weight:800;color:var(--cyan);letter-spacing:2px;text-shadow:0 0 10px rgba(45,226,255,0.4)}
  .tabs{display:flex;gap:6px}
  .tab{font-size:10px;letter-spacing:2px;padding:3px 12px;border:1px solid var(--grid);color:var(--dim);text-decoration:none;text-transform:uppercase}
  .tab.active{color:#04130c;background:var(--neon);border-color:var(--neon)}
  .tab:hover:not(.active){border-color:var(--cyan-dim);color:var(--cyan)}
  .hstats{display:flex;gap:10px}
  .hstat{text-align:center;border:1px solid var(--grid);background:var(--panel2);padding:5px 10px;min-width:60px}
  .hstat .v{font-size:18px;font-weight:800;line-height:1;color:var(--neon)}
  .hstat .k{font-size:8px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;margin-top:3px}

  /* ── team grid ── */
  .teams-section{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;min-height:0;overflow:hidden}

  /* ── team card ── */
  .tc{
    border:1px solid var(--grid);background:linear-gradient(180deg,var(--panel2),var(--panel));
    display:flex;flex-direction:column;gap:8px;padding:14px;position:relative;overflow:hidden;
    transition:border-color .3s;
  }
  .tc::before,.tc::after{content:"";position:absolute;width:12px;height:12px;pointer-events:none}
  .tc::before{top:-1px;left:-1px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan)}
  .tc::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--cyan);border-right:2px solid var(--cyan)}
  .tc.online{border-color:rgba(45,255,140,0.4)}
  .tc.offline{border-color:var(--grid)}
  .tc.banned{border-color:var(--red);box-shadow:inset 0 0 24px rgba(255,46,77,0.12);animation:bdr-pulse 1.5s infinite}
  .tc.leader{border-color:var(--neon);box-shadow:0 0 24px rgba(0,255,156,0.15),inset 0 0 20px rgba(0,255,156,0.06)}
  .tc.leader::before,.tc.leader::after{border-color:var(--neon)}
  @keyframes bdr-pulse{50%{box-shadow:inset 0 0 30px rgba(255,46,77,0.25),0 0 16px rgba(255,46,77,0.3)}}

  .tc-head{display:flex;align-items:center;gap:8px}
  .tc-led{width:12px;height:12px;border-radius:50%;flex-shrink:0;background:var(--dimmer);border:1px solid #000}
  .tc.online .tc-led{background:var(--green);box-shadow:0 0 10px var(--green)}
  .tc.banned .tc-led{background:var(--red);box-shadow:0 0 12px var(--red);animation:blink .7s steps(2,start) infinite}
  .tc-name{font-size:16px;font-weight:800;letter-spacing:1px;color:var(--txt);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tc.leader .tc-name{color:var(--neon)}
  .tc-badge{font-size:8px;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--grid);color:var(--dim);padding:1px 5px;border-radius:2px;flex-shrink:0}
  .tc.online .tc-badge{color:var(--green);border-color:rgba(45,255,140,0.4)}
  .tc.banned .tc-badge{color:var(--red);border-color:var(--red);background:rgba(255,46,77,0.12)}
  .tc.leader::after{content:"★ LÍDER";position:absolute;top:0;right:0;font-size:7px;letter-spacing:1px;color:#04130c;background:var(--neon);padding:1px 6px;font-weight:800}

  .tc-score{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .tc-pts{font-size:38px;font-weight:800;color:var(--neon);line-height:1;text-shadow:0 0 16px rgba(0,255,156,0.35)}
  .tc-pts-lbl{font-size:9px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;align-self:flex-end;padding-bottom:4px}
  .tc-solves{font-size:11px;color:var(--cyan);font-weight:700;align-self:flex-end;padding-bottom:4px}

  .tc-players{display:flex;flex-wrap:wrap;gap:5px;min-height:22px}
  .player-chip{font-size:10px;color:var(--cyan);border:1px solid var(--cyan-dim);background:rgba(45,226,255,0.07);padding:2px 8px;border-radius:2px;display:flex;align-items:center;gap:4px}
  .player-chip .pdot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 5px var(--green)}
  .player-chip.empty{color:var(--dimmer);border-color:var(--dimmer);background:none}

  .tc-challenge{font-size:11px;padding:6px 8px;border-left:3px solid var(--neon);background:linear-gradient(90deg,rgba(0,255,156,0.1),transparent);color:#c8ffe2;min-height:28px;display:flex;align-items:center;gap:6px}
  .tc-challenge .lbl{color:var(--dim);font-size:9px;letter-spacing:2px;text-transform:uppercase;display:block;margin-bottom:1px}
  .tc-challenge.none{border-left-color:var(--dimmer);background:none;color:var(--dim)}

  .tc-last{font-size:10px;color:var(--dim);line-height:1.3;border-top:1px solid rgba(27,60,82,0.4);padding-top:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

  /* ── solve ticker ── */
  .ticker{
    border:1px solid var(--grid);background:linear-gradient(90deg,var(--panel2),var(--panel));
    padding:6px 14px;display:flex;align-items:center;gap:12px;overflow:hidden;
    flex-shrink:0;
  }
  .ticker-lbl{font-size:9px;color:var(--neon);letter-spacing:3px;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
  .ticker-items{flex:1;display:flex;gap:24px;overflow:hidden;white-space:nowrap}
  .tick-item{font-size:11px;display:inline-flex;align-items:center;gap:8px;animation:fadein .5s ease}
  @keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  .tick-item .tico{font-size:14px}
  .tick-item .tteam{color:var(--cyan);font-weight:700}
  .tick-item .tts{color:var(--dim);font-size:9px}
  .tick-empty{color:var(--dim);font-size:11px;letter-spacing:1px}

  /* responsive — cuando no cabe en 5 cols */
  @media(max-width:1100px){.teams-section{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:700px){.teams-section{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">

  <!-- ── HEADER ── -->
  <header>
    <div class="brand">
      <div class="logo" id="logoName">CTFHL4 <span class="live-badge"><span class="led-r"></span>LIVE</span></div>
      <div class="subtitle">BROADCAST · STREAMS</div>
    </div>
    <div class="hstats">
      <div class="hstat"><div class="v" id="sSolves">0</div><div class="k">Solves</div></div>
      <div class="hstat"><div class="v" id="sTeams">0</div><div class="k">Equipos ON</div></div>
      <div class="hstat"><div class="v" id="sPlayers">0</div><div class="k">Jugadores</div></div>
      <div class="hstat" style="--neon:var(--red)"><div class="v" id="sAlerts">0</div><div class="k">Alertas</div></div>
    </div>
    <div class="clock-box" id="clock">--:--:--</div>
    <div class="tabs">
      <a href="/" class="tab">SIEM</a>
      <a href="/streams" class="tab active">STREAMS</a>
    </div>
  </header>

  <!-- ── TEAMS GRID ── -->
  <div class="teams-section" id="teamsGrid">
    <!-- populated by JS -->
  </div>

</div>

<!-- ── solve ticker como overlay abajo ── -->
<div class="ticker" style="position:fixed;bottom:0;left:0;right:0;z-index:10">
  <span class="ticker-lbl">✅ SOLVES</span>
  <div class="ticker-items" id="ticker"><span class="tick-empty">Esperando primer solve…</span></div>
</div>

<script>
const POLL_MS = 4000;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function relTime(iso){
  const t=new Date(iso).getTime(); if(isNaN(t))return"";
  const s=Math.max(0,Math.round((Date.now()-t)/1000));
  if(s<60)return"hace "+s+"s"; const m=Math.floor(s/60);
  if(m<60)return"hace "+m+"m"; return"hace "+Math.floor(m/60)+"h";
}
async function getJSON(url){const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()}

/* ── reloj ── */
function tickClock(){
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  document.getElementById("clock").textContent=p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
}
setInterval(tickClock,1000);tickClock();

/* ── stats header ── */
const lastS={};
function setStat(id,val){
  const el=document.getElementById(id);if(!el)return;
  const v=val??0;
  if(lastS[id]!==undefined&&lastS[id]!==v){el.style.transform="scale(1.25)";setTimeout(()=>el.style.transform="",300)}
  lastS[id]=v;el.textContent=v;
}
async function tickStats(){
  try{
    const s=await getJSON("/api/stats");
    setStat("sSolves",s.solves);setStat("sTeams",s.teams_online);
    setStat("sPlayers",s.players_online);setStat("sAlerts",s.alerts);
    if(s.ctf_name)document.getElementById("logoName").innerHTML=
      esc(s.ctf_name)+' <span class="live-badge"><span class="led-r"></span>LIVE</span>';
  }catch(e){}
}

/* ── ticker de solves ── */
let knownSolves=[];
async function tickSolves(){
  try{
    const feed=await getJSON("/api/feed?limit=100");
    const solves=feed.filter(it=>it.kind==="flag_ok");
    if(!solves.length){document.getElementById("ticker").innerHTML='<span class="tick-empty">Sin solves aún…</span>';return;}
    document.getElementById("ticker").innerHTML=solves.slice(0,8).map(it=>`
      <span class="tick-item">
        <span class="tico">✅</span>
        <span class="tteam">${esc(it.team)}</span>
        <span>${esc(it.text.replace(it.team,"").trim())}</span>
        <span class="tts">${esc(relTime(it.ts))}</span>
      </span>`).join('<span style="color:var(--dimmer);font-size:10px">·</span>');
  }catch(e){}
}

/* ── team cards ── */
async function tickTeams(){
  const grid=document.getElementById("teamsGrid");
  try{
    const teams=await getJSON("/api/teams");
    if(!teams.length)return;
    grid.innerHTML=teams.map(t=>{
      const status=t.status||"offline";
      const cls=[status];if(t.leader)cls.push("leader");
      const stTxt=status==="banned"?"BANEADO":status==="online"?"ONLINE":"OFFLINE";

      /* jugadores conectados */
      const players=t.players||[];
      const playerChips=players.filter(p=>p&&p!=="—").length
        ?players.filter(p=>p&&p!=="—").map(p=>`<span class="player-chip"><span class="pdot"></span>${esc(p)}</span>`).join("")
        :`<span class="player-chip empty">sin conexiones</span>`;

      /* reto actual */
      const chalText=t.current_challenge||t.last_action||"sin actividad";
      const chalCls=t.current_challenge?"":"none";

      /* última acción */
      const lastTxt=t.last_action||"sin actividad";

      return `<div class="tc ${cls.join(" ")}">
        <div class="tc-head">
          <span class="tc-led"></span>
          <span class="tc-name">${esc(t.team)}</span>
          <span class="tc-badge">${stTxt}</span>
        </div>
        <div class="tc-score">
          <div>
            <div class="tc-pts">${esc(t.points??0)}</div>
          </div>
          <div style="text-align:right">
            <div class="tc-solves">${esc(t.solves??0)} solves</div>
            <div class="tc-pts-lbl">puntos</div>
          </div>
        </div>
        <div class="tc-players">${playerChips}</div>
        <div class="tc-challenge ${chalCls}">
          <span>🎯 ${esc(chalText)}</span>
        </div>
        <div class="tc-last">${esc(lastTxt)}</div>
      </div>`;
    }).join("");
  }catch(e){}
}

/* ── loop ── */
function loop(){tickStats();tickTeams();tickSolves();}
loop();
setInterval(loop,POLL_MS);
</script>
</body>
</html>
