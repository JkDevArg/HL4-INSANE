# ============================================================================
# server-ban-additions.conf
# ----------------------------------------------------------------------------
# Directivas a AÑADIR al /etc/openvpn/server.conf que genera setup-server.sh.
# NO reescribas setup-server.sh: copia estas lineas al final del server.conf
# (o haz: cat server-ban-additions.conf >> /etc/openvpn/server.conf).
#
# Requisito previo: copiar los scripts a /etc/openvpn/scripts/ y darles +x:
#     mkdir -p /etc/openvpn/scripts
#     cp vpn/scripts/on-connect.sh on-disconnect.sh ban-team.sh \
#        unban.sh revoke-team.sh gen-team-cert.sh /etc/openvpn/scripts/
#     chmod +x /etc/openvpn/scripts/*.sh
# ============================================================================

# script-security 2 -> permite ejecutar scripts/binarios definidos en la config.
# (1 = nada, 2 = scripts integrados, 3 = pasa tambien passwords; usamos 2).
# Debe ir ANTES de las directivas client-connect / client-disconnect.
script-security 2

# Hook al conectar un cliente (tras handshake TLS, antes de habilitar trafico).
# Si el script sale != 0 (equipo baneado) OpenVPN aborta la conexion.
client-connect /etc/openvpn/scripts/on-connect.sh

# Hook al desconectar un cliente. Clasifica limpia-vs-timeout, cuenta y banea.
client-disconnect /etc/openvpn/scripts/on-disconnect.sh

# Management interface local: ban-team.sh la usa para "kill <CN>" y cortar la
# sesion activa al instante. Solo localhost (no exponer). Si se omite, ban-team
# cae a "systemctl reload" como fallback (la CRL corta en el siguiente handshake).
management 127.0.0.1 7505

# NOTA: el keepalive del server.conf base es "keepalive 10 120". El valor 120
# es el KEEPALIVE_TIMEOUT que usa la heuristica de on-disconnect.sh. Si cambias
# el keepalive, exporta KEEPALIVE_TIMEOUT acorde (p.ej. en /etc/openvpn/scripts/ban.env).

# NOTA: crl-verify NO se pone aqui — revoke-team.sh ya lo agrega al server.conf
# la primera vez que se revoca un cert. (revoke-team.sh: "crl-verify crl.pem").
