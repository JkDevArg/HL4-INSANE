# ============================================================================
#  server-additions.conf — Directivas a AÑADIR a /etc/openvpn/server.conf
# ============================================================================
#  Estas líneas implementan la sección 6.1 (Bloqueo de IA) del contrato:
#  la VPN se convierte en gateway TOTAL y empuja el DNS interno (dnsmasq) a
#  los clientes, de modo que TODO el tráfico y TODAS las resoluciones DNS
#  pasen por el servidor (donde actúan nftables + sinkhole).
#
#  CÓMO APLICAR (NO se reescribe setup-server.sh):
#    1) setup-server.sh genera /etc/openvpn/server.conf. Tras ejecutarlo,
#       AÑADE estas líneas al FINAL de /etc/openvpn/server.conf, p.ej.:
#
#         sudo bash -c 'cat /ruta/vpn/configs/server-additions.conf >> /etc/openvpn/server.conf'
#
#    2) Reinicia el servicio:
#
#         sudo systemctl restart openvpn@server
#
#  NOTA: el server.conf actual ya empuja rutas a 10.10.100.0/24 y
#  10.10.200.0/24 y tiene client-to-client. El aislamiento real lo impone
#  nftables (forward chain); client-to-client solo habilita el routing, NO
#  permite saltar las reglas del firewall.
# ============================================================================

# --- Gateway total: todo el tráfico del cliente sale por la VPN ------------
# Fuerza que todas las peticiones DNS pasen por dnsmasq en 10.10.0.1, donde
# el sinkhole bloquea dominios de IA (ChatGPT, Claude, Gemini, etc.).
# El firewall (apply-firewall.sh) NO bloquea internet; solo el SIEM y
# los challenges de otros equipos. Las IAs las bloquea dnsmasq.
push "redirect-gateway def1"

# --- DNS interno: dnsmasq con sinkhole de IA (gateway VPN 10.10.0.1) --------
push "dhcp-option DNS 10.10.0.1"

# --- Endurecimiento DNS (evitar fugas / DNS propio del cliente) ------------
# Pide a los clientes (Windows/macOS recientes) bloquear DNS fuera del túnel.
push "block-outside-dns"

# --- Hooks de cliente (SIEM): on-connect/on-disconnect y directorio CCD ----
# Sin estas directivas, on-connect.sh NUNCA se llama y el SIEM no recibe
# ningún evento VPN. client-config-dir permite configuración per-CN.
script-security 2
client-connect /etc/openvpn/scripts/on-connect.sh
client-disconnect /etc/openvpn/scripts/on-disconnect.sh
client-config-dir /etc/openvpn/ccd

# --- (Opcional) Empujar también la ruta a las redes Docker de retos --------
# Si las redes 172.30.N.0/24 deben ser alcanzables directamente por el
# cliente, descomenta. El firewall ya restringe cada equipo a la SUYA.
# push "route 172.30.0.0 255.255.0.0"
